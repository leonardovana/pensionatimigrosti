{{ define "main" }}
<section class="prose">
  <h1>{{ .Title }}</h1>
  {{ .Content }}
</section>
<ul class="post-list">
  {{ range .Pages.ByDate.Reverse }}
  <li>
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date | time.Format ":date_medium" }}</time>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
  </li>
  {{ end }}
</ul>
{{ end }}
