# Site settings. baseURL is overridden by the GitHub Pages workflow.
baseURL = "https://www.pensionatimigrosti.ch/"
languageCode = "it-CH"
defaultContentLanguage = "it"
title = "Associazione Pensionati Migros Ticino"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
  description = "Tenere sempre vivo e rispettare lo spirito di appartenenza alla Migros"

[menus]
  [[menus.main]]
    name = "Home"
    pageRef = "/"
    weight = 10
  [[menus.main]]
    name = "Associazione"
    pageRef = "/associazione"
    weight = 20
  [[menus.main]]
    name = "Scopo"
    pageRef = "/scopo"
    weight = 30
  [[menus.main]]
    name = "Notizie"
    pageRef = "/notizie"
    weight = 40
  [[menus.main]]
    name = "Foto"
    pageRef = "/foto"
    weight = 50

[markup.goldmark.renderer]
  # Allow raw HTML inside Markdown.
  unsafe = true

[imaging]
  quality = 82
  resampleFilter = "Lanczos"
